services:
  - type: web
    name: telegram-bot
    env: docker
    docker:
      dockerfile: Dockerfile
    envVars:
      - key: BOT_TOKEN
        value: your_bot_token_here
      - key: BOT_USERNAME
        value: your_bot_username
      - key: DB_HOST
        value: your_db_host
      - key: DB_USER
        value: your_db_user
      - key: DB_PASS
        value: your_db_password
      - key: DB_NAME
        value: your_db_name
      - key: DB_PORT
        value: your_db_port
